# Сервер DROPZONE: AUTO на Cloudflare Workers
name = "dropzone-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# База данных D1. database_id подставляется после `npx wrangler d1 create dropzone`
[[d1_databases]]
binding = "DB"
database_name = "dropzone"
database_id = "3c0971b3-869a-440a-9963-b52c0ae23a6e"

# Токен бота хранится как секрет: npx wrangler secret put BOT_TOKEN
# (вводит владелец сам, в коде и в git его нет)


# Расписание: в ночь на понедельник 00:05 по Москве (21:05 UTC воскресенья) — недельные призы рейтинга
[triggers]
crons = ["5 21 * * SUN", "0 * * * *"]

# ...
[observability]
enabled = false
# ...
