<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DROPZONE: AUTO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap">
  <link rel="stylesheet" href="css/style.css?v=151">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="head-l">
        <button class="avatar" id="avatar" data-act="profile" aria-label="Профиль"></button>
        <div class="large-title" id="title">Гараж</div>
      </div>
      <div class="head-r">
        <button class="gift" id="gift" data-act="rewards" aria-label="Награды"></button>
        <div class="balance" id="balance">0 ₽</div>
      </div>
    </header>
    <main id="screen"></main>
  </div>

  <nav class="tabbar" id="tabs">
    <div class="tab-thumb" id="tab-thumb"></div>
    <button data-tab="garage">Гараж</button>
    <button data-tab="cases">Кейсы</button>
    <button data-tab="shop">Мастерская</button>
    <button data-tab="menu">Меню</button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grabber-zone" id="grabber"><div class="grabber"></div></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js?v=151"></script>
  <script src="js/paint.js?v=151"></script>
  <script src="js/rules.js?v=151"></script>
  <script src="js/game.js?v=151"></script>
  <script src="js/race.js?v=151"></script>
  <script src="js/duel.js?v=151"></script>
  <script src="js/rewards.js?v=151"></script>
  <script src="js/showroom.js?v=151"></script>
  <script src="js/profile.js?v=151"></script>
  <script src="js/stories.js?v=151"></script>
  <script src="js/promo.js?v=151"></script>
  <script src="js/friends.js?v=151"></script>
  <script src="js/plates.js?v=151"></script>
  <script src="js/rating.js?v=151"></script>
  <script src="js/store.js?v=151"></script>
  <script src="js/market.js?v=151"></script>
  <script src="js/upgrade.js?v=151"></script>
  <script src="js/containers.js?v=151"></script>
  <script src="js/events.js?v=151"></script>
  <script src="js/notify.js?v=151"></script>
</body>
</html>
